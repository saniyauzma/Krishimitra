services:
  - type: web
    name: krishimitra-api-v2
    env: python
    pythonVersion: "3.11"
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: python -m pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_ENVIRONMENT
        value: us-east-1
      - key: PINECONE_INDEX_NAME
        value: krishimitra-knowledge
      - key: EMBEDDING_MODEL_NAME
        value: sentence-transformers/all-mpnet-base-v2
      - key: EMBEDDING_DIMENSION
        value: "768"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-exp
      - key: DEFAULT_TOP_K
        value: "5"
      - key: MAX_TOP_K
        value: "20"
      - key: MAX_TOKENS
        value: "1000"
      - key: TEMPERATURE
        value: "0.7"
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: GRAPH_TIMEOUT
        value: "30"
      - key: ENABLE_GRAPH_LOGGING
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.11"
